name: CI

on:
  push:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/workflows/node
      - run: pnpm run lint
      - run: pnpm run format:check
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/workflows/node
      - run: pnpm run typecheck
  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/workflows/node
      - run: pnpm run knip
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/workflows/node
      - run: pnpm run build
      - name: Log run number, attempt and id
        run: |
          echo "Run number: ${{ github.run_number }}"
      - name: Update manifest.json version
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          jq --arg version "1.0.${{ github.run_number }}" \
          --arg version_name "1.0.${{ github.run_number }}-$GIT_HASH" \
          '.version = $version | .version_name = $version_name' \
          dist/manifest.json > tmp_manifest.json && \
          mv tmp_manifest.json dist/manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: ./dist
      - name: Upload build artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/workflows/node
      - run: pnpm test

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: [lint, typecheck, knip, build, test]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
  deploy-chrome-store:
    # Disabled until the store credentials are fixed, see
    # https://github.com/adipascu/solid-motivation/issues/30
    if: false
    needs: [lint, typecheck, knip, build, test]
    environment:
      name: chrome-store
      url: https://chrome.google.com/webstore/detail/motivation/${{ vars.CHROME_EXTENSION_ID }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: ./dist
      - run: cd dist && zip -r ../dist.zip .
      - uses: mnao305/chrome-extension-upload@4008e29e13c144d0f6725462cbd49b7c291b4928 # v5.0.0
        with:
          file-path: ./dist.zip
          extension-id: ${{ vars.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
  deploy-firefox-store:
    if: github.ref == 'refs/heads/main'
    needs: [lint, typecheck, knip, build, test]
    environment:
      name: firefox-store
      url: https://addons.mozilla.org/en-US/firefox/addon/${{ vars.FIREFOX_EXTENSION_ID }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: ./dist
      - run: cd dist && zip -r ../dist.zip .
      - uses: maoserr/firefox_extension_publish@1e1144f073dbdc5cc9c5c0e601823d4825e48455 # v1.0.4
        with:
          firefox_extension_id: ${{ vars.FIREFOX_EXTENSION_ID }}
          api_key: ${{ secrets.FIREFOX_ISSUER }}
          api_secret: ${{ secrets.FIREFOX_SECRET }}
          file: ./dist.zip
